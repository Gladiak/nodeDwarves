name: Training Quality Gates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  training-quality-gates:
    name: Extended + Weekly Horizon Gates
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Snapshot debug files
        run: |
          set -euo pipefail
          node scripts/assemble_quality_artifacts.js --snapshot

      - name: Run extended quality gate
        id: validate_extended
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run ai:validate 2>&1 | tee debug/ci_validate_extended.log

      - name: Run weekly horizon quality gate
        id: validate_weekly
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run ai:validate:weekly 2>&1 | tee debug/ci_validate_horizon_weekly.log

      - name: Assemble CI artifacts
        id: assemble_artifacts
        if: always()
        env:
          EXTENDED_OUTCOME: ${{ steps.validate_extended.outcome }}
          WEEKLY_OUTCOME: ${{ steps.validate_weekly.outcome }}
        run: |
          set -euo pipefail
          node scripts/assemble_quality_artifacts.js

      - name: Upload canonical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical
          path: debug/ci_artifacts/canonical
          if-no-files-found: warn

      - name: Upload regression artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression
          path: debug/ci_artifacts/regression
          if-no-files-found: warn

      - name: Upload risk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk
          path: debug/ci_artifacts/risk
          if-no-files-found: warn

      - name: Upload horizon artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon
          path: debug/ci_artifacts/horizon
          if-no-files-found: warn

      - name: Upload horizon weekly artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon_weekly
          path: debug/ci_artifacts/horizon_weekly
          if-no-files-found: warn

      - name: Enforce gate outcomes
        if: always()
        run: |
          set -euo pipefail
          echo "extended=${{ steps.validate_extended.outcome }}"
          echo "weekly=${{ steps.validate_weekly.outcome }}"
          echo "artifacts=${{ steps.assemble_artifacts.outcome }}"
          if [ "${{ steps.validate_extended.outcome }}" != "success" ] || [ "${{ steps.validate_weekly.outcome }}" != "success" ] || [ "${{ steps.assemble_artifacts.outcome }}" != "success" ]; then
            echo "One or more validation commands or artifact freshness checks failed."
            exit 1
          fi
